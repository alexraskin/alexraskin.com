[settings]
lockfile = true

[tools]
python = "3.13"
terraform = "1.17"

[tasks.dev]
run = "python -m http.server -d public 8000"

[tasks.lint]
description = "terraform fmt check"
run = "terraform fmt -check -recursive terraform"

[tasks."tf:init"]
description = "terraform init for $TF_ENV (default prod)"
dir = "terraform"
run = "terraform init -input=false -reconfigure -backend-config=envs/${TF_ENV:-prod}.backend.hcl"

[tasks."tf:plan"]
description = "terraform plan for $TF_ENV (default prod)"
dir = "terraform"
run = "terraform plan -input=false -var-file=envs/${TF_ENV:-prod}.tfvars -out=${TF_ENV:-prod}.tfplan"

[tasks."tf:apply"]
description = "terraform apply the saved plan for $TF_ENV (default prod)"
dir = "terraform"
run = "terraform apply ${TF_ENV:-prod}.tfplan"

[tasks."tf:destroy"]
description = "terraform destroy $TF_ENV (default prod); asks for confirmation"
dir = "terraform"
run = "terraform destroy -var-file=envs/${TF_ENV:-prod}.tfvars"
