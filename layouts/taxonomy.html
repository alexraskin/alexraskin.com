{{ define "main" }}
  <h1 class="title">{{ .Title }}</h1>
  <ul class="post-list">
    {{- range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}"><span class="post-list__title">{{ .Name }}</span><time>{{ .Count }} {{ cond (eq .Count 1) "post" "posts" }}</time></a></li>
    {{- end }}
  </ul>
{{ end }}
