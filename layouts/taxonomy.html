{{ define "main" }}
  <h1 class="title"><span class="title__mark" aria-hidden="true">#</span>{{ lower .Title }}</h1>
  <ul class="tag-cloud">
    {{- range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}">#{{ .Name }}</a><span>{{ .Count }}</span></li>
    {{- end }}
  </ul>
{{ end }}
