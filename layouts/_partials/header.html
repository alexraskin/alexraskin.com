<header class="header">
  <a class="site-name" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  {{- with site.Menus.main }}
  <nav class="nav" aria-label="Main">
    <ul>
      {{- range . }}
      <li><a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) (eq .URL $.RelPermalink) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
  {{- end }}
</header>
