baseURL = "https://alexraskin.com/"
locale = "en-us"
title = "Alex Raskin"
theme = "terminal"
enableRobotsTXT = true
pagination.pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

[params]
  contentTypeName = "posts"
  subtitle = "Alex Raskin - DevOps Engineer"
  showMenuItems = 5
  readMore = "Read more"
  centerTheme = true
  [params.logo]
    logoText = "alex"
    logoHomeLink = "/"
  [params.twitter]
    site = "@notalexraskin"
    creator = "@notalexraskin"

[menu]
  [[menu.main]]
    name = "Resume"
    url = "/resume/"
    weight = 1
  [[menu.main]]
