baseURL = "https://alexraskin.com/"
locale = "en-us"
title = "Alex Raskin"
enableRobotsTXT = true
pagination.pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "catppuccin-macchiato"

[params]
  contentTypeName = "posts"
  subtitle = "Alex Raskin - DevOps Engineer"
  readMore = "Read more"
  [params.logo]
    logoText = "alex"
    logoHomeLink = "/"
  [params.twitter]
    site = "@notalexraskin"
    creator = "@notalexraskin"

[menu]
  [[menu.main]]
    name = "Resume"
    url = "/resume/"
    weight = 1
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 2
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    name = "Photography"
    url = "https://photography.alexraskin.com/"
    weight = 4
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/alexraskin"
    weight = 5
  [[menu.main]]
    name = "Twitter"
    url = "https://twitter.com/notalexraskin"
    weight = 6

[deployment]
  [[deployment.targets]]
    name = "prod"
    URL = "s3://alexraskin-prod-web-088966585880?region=us-east-1"
    cloudFrontDistributionID = "E1MLOWZLXWD8KN"

  [[deployment.matchers]]
    pattern = "^(css|fonts)/"
    cacheControl = "public, max-age=31536000, immutable"

  [[deployment.matchers]]
    pattern = ".*"
    cacheControl = "public, max-age=0, s-maxage=31536000"
