baseURL = "https://alexraskin.com/"
locale = "en-us"
title = "Alex Raskin"
enableRobotsTXT = true
pagination.pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[params]
  contentTypeName = "posts"
  subtitle = "Alexander (Alex) Raskin - DevOps Engineer"
  fullName = "Alexander Raskin"
  repo = "https://github.com/alexraskin/alexraskin.com"
  readMore = "Read more"
  dateFormat = "January 2, 2006"
  github = "https://github.com/alexraskin"
  twitterURL = "https://twitter.com/notalexraskin"
  [params.twitter]
    site = "@notalexraskin"
    creator = "@notalexraskin"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "Resume"
    url = "/resume/"
    weight = 3
  [[menu.main]]
    name = "Photos"
    url = "https://photography.alexraskin.com/"
    weight = 4

[deployment]
  [[deployment.targets]]
    name = "prod"
    URL = "s3://alexraskin-prod-web-088966585880?region=us-east-1"
    cloudFrontDistributionID = "E1MLOWZLXWD8KN"

  [[deployment.matchers]]
    pattern = "^(css|fonts)/"
    cacheControl = "public, max-age=31536000, immutable"

  [[deployment.matchers]]
    pattern = ".*"
    cacheControl = "public, max-age=0, s-maxage=31536000"
