name: pipeline
on:
 push:
   branches:
     - main
   tags:
     - "v*"

permissions:
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Prepare Version Info
        run: |
          echo "VERSION=$(git describe --tags --always)" >> $GITHUB_ENV
          echo "COMMIT=${{ github.sha }}" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Prepare Image Tags
        run: |
          image=ghcr.io/alexraskin/alexraskin.com
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAGS=$image:latest,$image:${{ github.ref_name }},$image:${{ github.sha }}" >> $GITHUB_ENV
          else
            # Staging. The epoch orders these for Flux, which gets no usable
            # creation time out of GHCR, and the prefix keeps them clear of the
            # semver tags production tracks.
            echo "TAGS=$image:main-$(date -u +%s)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: ${{ env.TAGS }}
