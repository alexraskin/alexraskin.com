formatter: "markdown"
version: "~> 0.20"
header-from: main.tf

output:
  file: "README.md"
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: name

settings:
  anchor: true
  default: true
  description: true
  escape: true
  html: true
  indent: 2
  read-comments: true
  required: true
  sensitive: true
  type: true
